<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand Combo ✋ ท่ามือคอมโบ</title>
<style>
:root{color-scheme:dark;--bg:#0b0f1a;--card:#141b2d;--tx:#e8ecf7;--mut:#8b95b3;--ac:#4fd1ff;--ac2:#ff5ea8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.stage{position:relative;aspect-ratio:4/3;background:#000;border-radius:16px;overflow:hidden;border:1px solid #243052}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,15,26,.88);text-align:center;padding:20px}
button{background:var(--ac);color:#04121a;border:0;border-radius:12px;padding:14px 26px;font-size:17px;font-weight:700;cursor:pointer}
#status{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:20px;font-size:14px;z-index:3}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ac2);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;z-index:3;text-decoration:none;white-space:nowrap}
#toast.on{opacity:1}
.card{background:var(--card);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}
.chip{background:#1f2a47;border-radius:8px;padding:4px 10px;font-size:14px}
.pat{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #243052;font-size:15px}
.pat:first-of-type{border-top:0}
.pat b{color:var(--ac)}
.pat.hit{background:#2a1f3d}
small{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
<h1>✋ Hand Combo — ทำท่ามือต่อเนื่องเพื่อสั่งการ</h1>
<div class="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
  <div id="status">รอเริ่ม…</div>
  <a id="toast" target="_blank" rel="noopener"></a>
  <div id="start">
    <div style="font-size:42px">📷</div>
    <div>กดเริ่มเพื่อเปิดกล้องหน้า<br><small>ภาพจะไม่ถูกอัปโหลด ประมวลผลในเครื่องคุณ</small></div>
    <button id="go">เริ่มใช้งาน</button>
  </div>
</div>
<div class="card"><h2>ท่าที่ตรวจจับล่าสุด</h2><div class="chips" id="hist"></div></div>
<div class="card"><h2>แพทเทิร์น (ทำต่อเนื่องภายใน 4 วินาที)</h2><div id="pats"></div>
<small>ท่าที่รู้จัก: ✊ กำมือ · ✌️ สองนิ้ว (ชี้+กลาง) · 🤟 สามนิ้ว (ชี้+กลาง+นาง) · 🖐 แบมือ</small></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
// ====== ตั้งค่าแพทเทิร์นตรงนี้ ======
const PATTERNS=[
  {name:'กำมือ → สองนิ้ว',seq:['fist','two'],label:'เปิด Google',run:()=>openUrl('https://www.google.com')},
  {name:'สองนิ้ว → สามนิ้ว',seq:['two','three'],label:'กระสุนวงจักร!',run:()=>chakra()},
];
const ICON={fist:'✊ กำมือ',two:'✌️ สองนิ้ว',three:'🤟 สามนิ้ว',open:'🖐 แบมือ',other:'…'};
const WINDOW_MS=4000, STABLE=7;

const $=id=>document.getElementById(id);
const v=$('v'),cv=$('c'),ctx=cv.getContext('2d');
$('pats').innerHTML=PATTERNS.map((p,i)=>`<div class="pat" id="p${i}"><span>${p.seq.map(s=>ICON[s].split(' ')[0]).join(' → ')} <small>${p.name}</small></span><b>${p.label}</b></div>`).join('');

const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function classify(l){
  const w=l[0];
  const up=(t,p)=>d(l[t],w)>d(l[p],w)*1.15;
  const i=up(8,6),m=up(12,10),r=up(16,14),p=up(20,18);
  const n=[i,m,r,p].filter(Boolean).length;
  if(n===0)return 'fist';
  if(i&&m&&!r&&!p)return 'two';
  if(i&&m&&r&&!p)return 'three';
  if(n===4)return 'open';
  return 'other';
}

let hist=[],cand=null,candN=0,cur='other',lastPalm=null,fx=[];
function onGesture(g){
  if(g===cand)candN++;else{cand=g;candN=1}
  if(candN===STABLE&&g!==cur){
    cur=g;
    if(g!=='other'){hist.push({g,t:performance.now()});hist=hist.slice(-6);renderHist();check()}
  }
}
function renderHist(){$('hist').innerHTML=hist.map(h=>`<span class="chip">${ICON[h.g]}</span>`).join('')||''}
function check(){
  const now=performance.now();
  PATTERNS.forEach((p,i)=>{
    const tail=hist.slice(-p.seq.length);
    if(tail.length===p.seq.length&&tail.every((h,k)=>h.g===p.seq[k])&&now-tail[0].t<WINDOW_MS){
      hist=[];renderHist();
      const el=$('p'+i);el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),1200);
      p.run();
    }
  });
}
function toast(t,href){const e=$('toast');e.textContent=t;if(href)e.href=href;else e.removeAttribute('href');e.classList.add('on');setTimeout(()=>e.classList.remove('on'),4000)}
function openUrl(u){
  toast('🌐 เปิด Google… (แตะที่นี่ถ้าไม่เปิด)',u);
  try{window.open(u,'_blank','noopener')}catch(e){}
}

// ====== เอฟเฟกต์กระสุนวงจักร ======
function chakra(){
  const p=lastPalm||{x:.5,y:.6};
  fx.push({x:p.x,y:p.y,born:performance.now(),r:0,rot:0,trail:[]});
  toast('🌀 กระสุนวงจักร!');
}
function drawChakra(W,H,now){
  fx=fx.filter(f=>now-f.born<1900);
  for(const f of fx){
    const t=now-f.born,charge=Math.min(t/500,1),fly=Math.max((t-500)/1400,0);
    const e=fly*fly;
    const x=(f.x+(0.5-f.x)*e)*W,y=(f.y+(0.35-f.y)*e)*H;
    const R=(28+charge*22+e*Math.min(W,H)*.55)*(1-Math.max(fly-.85,0)*5);
    f.rot+=.35+charge*.4;
    f.trail.push({x,y,R});if(f.trail.length>10)f.trail.shift();
    f.trail.forEach((q,i)=>{ctx.globalAlpha=i/f.trail.length*.25;ring(q.x,q.y,q.R*.9,0,'#4fd1ff')});
    ctx.globalAlpha=1;
    ctx.save();ctx.shadowColor='#4fd1ff';ctx.shadowBlur=40;
    const g=ctx.createRadialGradient(x,y,0,x,y,R*1.4);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.5,'rgba(79,209,255,.35)');g.addColorStop(1,'rgba(79,209,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R*1.4,0,7);ctx.fill();
    ring(x,y,R,f.rot,'#bff3ff');ring(x,y,R*.6,-f.rot*1.3,'#ff5ea8');
    ctx.restore();
  }
}
function ring(x,y,R,rot,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,R*.06);
  ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
  const n=8;ctx.beginPath();
  for(let i=0;i<n;i++){const a=i/n*6.283;ctx.moveTo(Math.cos(a-.18)*R,Math.sin(a-.18)*R);ctx.lineTo(Math.cos(a)*R*1.32,Math.sin(a)*R*1.32);ctx.lineTo(Math.cos(a+.18)*R,Math.sin(a+.18)*R)}
  ctx.fill();ctx.restore();
}

// ====== กล้อง + ตรวจจับมือ ======
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function onResults(res){
  const W=cv.width=v.videoWidth||640,H=cv.height=v.videoHeight||480;
  ctx.clearRect(0,0,W,H);
  const hands=res.multiHandLandmarks||[];
  if(hands.length){
    const l=hands[0];lastPalm={x:l[9].x,y:l[9].y};
    ctx.strokeStyle='rgba(79,209,255,.8)';ctx.lineWidth=3;
    CONN.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(l[a].x*W,l[a].y*H);ctx.lineTo(l[b].x*W,l[b].y*H);ctx.stroke()});
    ctx.fillStyle='#ff5ea8';l.forEach(p=>{ctx.beginPath();ctx.arc(p.x*W,p.y*H,4,0,7);ctx.fill()});
    const g=classify(l);onGesture(g);
    $('status').textContent='ตรวจพบ: '+ICON[g];
  }else{onGesture('other');$('status').textContent='ยังไม่เจอมือ — ยกมือให้อยู่ในกล้อง'}
  drawChakra(W,H,performance.now());
}
$('go').onclick=async()=>{
  $('go').disabled=true;$('go').textContent='กำลังเปิดกล้อง…';
  try{
    if(typeof Hands==='undefined')throw new Error('โหลดไลบรารีตรวจจับมือไม่สำเร็จ (เครือข่าย/CDN ถูกบล็อก)');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
    v.srcObject=stream;await v.play();
    const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(onResults);
    $('start').style.display='none';$('status').textContent='กำลังโหลดโมเดล…';
    let busy=false;
    (async function loop(){
      if(!busy&&v.readyState>=2){busy=true;try{await hands.send({image:v})}catch(e){}busy=false}
      requestAnimationFrame(loop);
    })();
  }catch(e){
    $('go').disabled=false;$('go').textContent='ลองใหม่';
    $('start').querySelector('div:nth-child(2)').innerHTML='⚠️ '+(e.message||e)+'<br><small>ตรวจสอบสิทธิ์กล้อง หรือดาวน์โหลดไฟล์ไปเปิดในเครื่อง</small>';
  }
};
</script>
</body>
</html>
