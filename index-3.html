<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand Combo ✋ ท่ามือคอมโบ</title>
<style>
:root{color-scheme:dark;--bg:#0b0f1a;--card:#141b2d;--tx:#e8ecf7;--mut:#8b95b3;--ac:#4fd1ff;--ac2:#ff5ea8;--bd:#243052;--chip:#1f2a47;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root.light{color-scheme:light;--bg:#eef2fb;--card:#fff;--tx:#14192b;--mut:#5b6580;--bd:#d5ddf2;--chip:#e3eafb}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;min-height:100vh;background:radial-gradient(900px 500px at 15% -10%,rgba(79,209,255,.16),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(255,94,168,.14),transparent 60%),var(--bg);transition:background .4s}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 40px}
header{text-align:center;margin-bottom:14px}
h1{font-size:30px;margin:0;letter-spacing:.3px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--mut);font-size:14px}
.stage{position:relative;aspect-ratio:4/3;background:#000;border-radius:20px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 0 0 1px rgba(79,209,255,.08),0 20px 60px -20px rgba(79,209,255,.35)}
.stage:fullscreen{aspect-ratio:auto;border-radius:0;border:0}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,15,26,.9);backdrop-filter:blur(8px);text-align:center;padding:20px;color:#e8ecf7;z-index:4}
#start>div:first-child{font-size:54px;animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
button{background:linear-gradient(90deg,var(--ac),#7b8cff);color:#04121a;border:0;border-radius:14px;padding:14px 30px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 24px -8px rgba(79,209,255,.6)}
button:hover{transform:translateY(-2px)}button:active{transform:scale(.97)}button:disabled{opacity:.6}
#status{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;z-index:3}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
#cur{position:absolute;right:12px;top:10px;font-size:44px;line-height:1;z-index:3;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);background:linear-gradient(90deg,var(--ac2),#ff8a5e);color:#fff;padding:11px 20px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:3;text-decoration:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px -8px rgba(255,94,168,.7)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.bar{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:9px 16px;font-size:14px;font-weight:600;box-shadow:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600;letter-spacing:.4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:32px}
.chip{background:var(--chip);border-radius:10px;padding:5px 11px;font-size:14px;animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:10px}
.pat{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:var(--chip);border:1px solid transparent;transition:.25s}
.pat .seq{font-size:24px;letter-spacing:2px}
.pat b{color:var(--ac);font-size:15px}
.pat.hit{border-color:var(--ac2);background:rgba(255,94,168,.18);box-shadow:0 0 22px rgba(255,94,168,.45);transform:scale(1.03)}
small{color:var(--mut)}
@media(max-width:520px){h1{font-size:24px}#cur{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>✋ Hand Combo</h1><p>ทำท่ามือต่อเนื่องภายใน 4 วินาทีเพื่อสั่งการ</p></header>
<div class="stage" id="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
  <div id="status">รอเริ่ม…</div>
  <div id="cur"></div>
  <a id="toast" target="_blank" rel="noopener"></a>
  <div id="start">
    <div>📷</div>
    <div>กดเริ่มเพื่อเปิดกล้องหน้า<br><small>ภาพไม่ถูกอัปโหลด ประมวลผลในเครื่องคุณ</small></div>
    <button id="go">เริ่มใช้งาน</button>
  </div>
</div>
<div class="bar">
  <button class="ghost" onclick="toggleMusic()">🎵 เพลง</button>
  <button class="ghost" onclick="toggleTheme()">🌓 ธีม</button>
  <button class="ghost" onclick="document.getElementById('stage').requestFullscreen&&document.getElementById('stage').requestFullscreen()">⛶ เต็มจอ</button>
</div>
<div class="card"><h2>ท่าที่ตรวจจับล่าสุด</h2><div class="chips" id="hist"></div></div>
<div class="card"><h2>แพทเทิร์น</h2><div class="grid" id="pats"></div>
<small>ท่าที่รู้จัก: ✊ กำมือ · ✌️ สองนิ้ว · 🤟 สามนิ้ว · 🖐 แบมือ · 👍 โป้ง · 🤘 ร็อก · 👌 โอเค · ☝️ ชี้นิ้วเดียว</small></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
// ====== ตั้งค่าแพทเทิร์นตรงนี้ ======
const PATTERNS=[
  // แพทเทิร์นยาวต้องอยู่ก่อนแพทเทิร์นสั้นที่ลงท้ายเหมือนกัน
  {name:'แบมือ → สองนิ้ว → สามนิ้ว',seq:['open','two','three'],label:'ไม้ตายสามจังหวะ: กระสุนวงจักรรัว!',run:()=>chakra(7)},
  {name:'แบมือ → กำมือ',seq:['open','fist'],label:'คลื่นพลังระเบิด',run:()=>shock()},
  {name:'กำมือ → สามนิ้ว',seq:['fist','three'],label:'สายฟ้าฟาด',run:()=>lightning()},
  {name:'สองนิ้ว → แบมือ',seq:['two','open'],label:'เปิด YouTube',run:()=>openUrl('https://www.youtube.com','YouTube')},
  {name:'สามนิ้ว → กำมือ',seq:['three','fist'],label:'โล่พลัง',run:()=>shield()},
  {name:'สามนิ้ว → แบมือ',seq:['three','open'],label:'เปิด Roblox',run:()=>openUrl('https://www.roblox.com','Roblox')},
  {name:'กำมือ → สองนิ้ว',seq:['fist','two'],label:'เปิด Google',run:()=>openUrl('https://www.google.com','Google')},
  {name:'สองนิ้ว → สามนิ้ว',seq:['two','three'],label:'กระสุนวงจักร!',run:()=>chakra(1)},
  {name:'ยกนิ้วโป้ง',seq:['thumb'],label:'ดอกไม้ไฟ/คอนเฟตติ',run:()=>fireworks()},
  {name:'ร็อก',seq:['rock'],label:'เปิด/ปิดเพลง',run:()=>toggleMusic()},
  {name:'โอเค',seq:['ok'],label:'สลับโหมดมืด/สว่าง',run:()=>toggleTheme()},
  {name:'ชี้นิ้วเดียว',seq:['point'],label:'เลเซอร์ตามปลายนิ้ว (ค้างท่า)',run:()=>toast('☝️ เลเซอร์!')},
];
const ICON={fist:'✊ กำมือ',two:'✌️ สองนิ้ว',three:'🤟 สามนิ้ว',open:'🖐 แบมือ',thumb:'👍 ยกนิ้วโป้ง',rock:'🤘 ร็อก',ok:'👌 โอเค',point:'☝️ ชี้นิ้ว',other:'…'};
const WINDOW_MS=4000, STABLE=7;

const $=id=>document.getElementById(id);
const v=$('v'),cv=$('c'),ctx=cv.getContext('2d');
$('pats').innerHTML=PATTERNS.map((p,i)=>`<div class="pat" id="p${i}"><div class="seq">${p.seq.map(s=>ICON[s].split(' ')[0]).join('→')}</div><b>${p.label}</b><small>${p.name}</small></div>`).join('');

const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function classify(l){
  const w=l[0],hs=d(l[0],l[9]);
  const up=(t,p)=>d(l[t],w)>d(l[p],w)*1.15;
  const i=up(8,6),m=up(12,10),r=up(16,14),p=up(20,18);
  const n=[i,m,r,p].filter(Boolean).length;
  if(m&&r&&p&&d(l[4],l[8])<hs*.4)return 'ok';
  if(n===0&&l[4].y<l[3].y&&l[3].y<l[2].y&&d(l[4],l[5])>hs*.45)return 'thumb';
  if(n===0)return 'fist';
  if(i&&!m&&!r&&!p)return 'point';
  if(i&&p&&!m&&!r)return 'rock';
  if(i&&m&&!r&&!p)return 'two';
  if(i&&m&&r&&!p)return 'three';
  if(n===4)return 'open';
  return 'other';
}

let hist=[],cand=null,candN=0,cur='other',lastPalm=null,fx=[];
function onGesture(g){
  if(g===cand)candN++;else{cand=g;candN=1}
  if(candN===STABLE&&g!==cur){
    cur=g;
    if(g!=='other'){hist.push({g,t:performance.now()});hist=hist.slice(-6);renderHist();check()}
  }
}
function renderHist(){$('hist').innerHTML=hist.map(h=>`<span class="chip">${ICON[h.g]}</span>`).join('')||''}
function check(){
  const now=performance.now();
  PATTERNS.forEach((p,i)=>{
    const tail=hist.slice(-p.seq.length);
    if(tail.length===p.seq.length&&tail.every((h,k)=>h.g===p.seq[k])&&now-tail[0].t<WINDOW_MS){
      hist=[];renderHist();
      const el=$('p'+i);el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),1200);
      p.run();
    }
  });
}
function toast(t,href){const e=$('toast');e.textContent=t;if(href)e.href=href;else e.removeAttribute('href');e.classList.add('on');setTimeout(()=>e.classList.remove('on'),4000)}
function openUrl(u,name){
  toast('🌐 เปิด '+name+'… (แตะที่นี่ถ้าไม่เปิด)',u);
  try{window.open(u,'_blank','noopener')}catch(e){}
}

// ====== เอฟเฟกต์กระสุนวงจักร ======
function chakra(n=1){
  const p=lastPalm||{x:.5,y:.6},now=performance.now();
  for(let k=0;k<n;k++){const m=n>1;
    fx.push({x:p.x+(m?(Math.random()-.5)*.2:0),y:p.y+(m?(Math.random()-.5)*.1:0),tx:m?.12+Math.random()*.76:.5,ty:m?.1+Math.random()*.45:.35,born:now+k*140,r:0,rot:0,trail:[]});
  }
  toast(n>1?'🌀🌀 ไม้ตาย! กระสุนวงจักรรัว!':'🌀 กระสุนวงจักร!');
}
function drawChakra(W,H,now){
  fx=fx.filter(f=>now-f.born<1900);
  for(const f of fx){
    const t=now-f.born;if(t<0)continue;
    const charge=Math.min(t/500,1),fly=Math.max((t-500)/1400,0);
    const e=fly*fly;
    const x=(f.x+(f.tx-f.x)*e)*W,y=(f.y+(f.ty-f.y)*e)*H;
    const R=(28+charge*22+e*Math.min(W,H)*.55)*(1-Math.max(fly-.85,0)*5);
    f.rot+=.35+charge*.4;
    f.trail.push({x,y,R});if(f.trail.length>10)f.trail.shift();
    f.trail.forEach((q,i)=>{ctx.globalAlpha=i/f.trail.length*.25;ring(q.x,q.y,q.R*.9,0,'#4fd1ff')});
    ctx.globalAlpha=1;
    ctx.save();ctx.shadowColor='#4fd1ff';ctx.shadowBlur=40;
    const g=ctx.createRadialGradient(x,y,0,x,y,R*1.4);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.5,'rgba(79,209,255,.35)');g.addColorStop(1,'rgba(79,209,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R*1.4,0,7);ctx.fill();
    ring(x,y,R,f.rot,'#bff3ff');ring(x,y,R*.6,-f.rot*1.3,'#ff5ea8');
    ctx.restore();
  }
}
function ring(x,y,R,rot,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,R*.06);
  ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
  const n=8;ctx.beginPath();
  for(let i=0;i<n;i++){const a=i/n*6.283;ctx.moveTo(Math.cos(a-.18)*R,Math.sin(a-.18)*R);ctx.lineTo(Math.cos(a)*R*1.32,Math.sin(a)*R*1.32);ctx.lineTo(Math.cos(a+.18)*R,Math.sin(a+.18)*R)}
  ctx.fill();ctx.restore();
}

// ====== เอฟเฟกต์อื่นๆ ======
let shocks=[],bolts=[],shields=[],parts=[],laser=null,palmS=.2,flashT=0,lastT=performance.now(),AC=null,musicT=null,mStep=0;
const rnd=Math.random;
function flash(){flashT=performance.now()}
function shock(){const p=lastPalm||{x:.5,y:.5};shocks.push({x:p.x,y:p.y,born:performance.now()});flash();toast('💥 คลื่นพลังระเบิด!')}
function lightning(){
  const now=performance.now();
  for(let k=0;k<5;k++){
    const x0=.1+rnd()*.8,x1=x0+(rnd()-.5)*.2,ty=.5+rnd()*.4,pts=[[x0,0]];
    for(let j=1;j<10;j++)pts.push([x0+(x1-x0)*j/10+(rnd()-.5)*.08,ty*j/10]);
    pts.push([x1,ty]);bolts.push({pts,born:now+k*90});
  }
  toast('⚡ สายฟ้าฟาด!');
}
function shield(){shields.push({born:performance.now()});toast('🛡 โล่พลัง!')}
function burst(x,y,n,hue){for(let k=0;k<n;k++){const a=rnd()*6.283,v=2+rnd()*6;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:performance.now(),life:900+rnd()*500,c:`hsl(${hue+rnd()*40},100%,60%)`,s:3+rnd()*3,g:.12})}}
function fireworks(){
  const W=cv.width||640,H=cv.height||480;
  for(let k=0;k<4;k++)setTimeout(()=>burst((.15+rnd()*.7)*W,(.15+rnd()*.4)*H,50,rnd()*360),k*220);
  for(let k=0;k<60;k++)parts.push({x:rnd()*W,y:-rnd()*H*.3,vx:(rnd()-.5)*2,vy:2+rnd()*3,born:performance.now(),life:2200,c:`hsl(${rnd()*360},90%,60%)`,s:5+rnd()*4,g:.03,rect:1});
  toast('🎆 ดอกไม้ไฟ!');
}
function toggleMusic(){
  if(musicT){clearInterval(musicT);musicT=null;toast('🔇 ปิดเพลง');return}
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){toast('เปิดเสียงไม่ได้');return}
  const N=[0,3,7,12,7,3,0,-5,0,3,7,10,7,3,2,-2];
  musicT=setInterval(()=>{
    const t=AC.currentTime,i=mStep++;
    const tone=(f,ty,vol,dur)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)};
    tone(220*Math.pow(2,N[i%N.length]/12),'square',.06,.2);
    if(i%4===0)tone(55,'sine',.25,.3);
    if(i%2===1)tone(1800,'triangle',.02,.05);
  },170);
  toast('🎵 เปิดเพลง (ทำท่าร็อกอีกครั้งเพื่อปิด)');
}
function toggleTheme(){const l=document.documentElement.classList.toggle('light');toast(l?'☀️ โหมดสว่าง':'🌙 โหมดมืด')}
function drawFx(W,H,now){
  const dt=Math.min((now-lastT)/16.7,3);lastT=now;
  if(now-flashT<350){ctx.fillStyle=`rgba(255,255,255,${.55*(1-(now-flashT)/350)})`;ctx.fillRect(0,0,W,H)}
  shocks=shocks.filter(s=>now-s.born<900);
  for(const s of shocks){const t=(now-s.born)/900;
    for(let k=0;k<3;k++){const u=t-k*.08;if(u<=0)continue;
      ctx.globalAlpha=1-u;ctx.strokeStyle=k?'#4fd1ff':'#fff';ctx.lineWidth=14*(1-u)+2;
      ctx.beginPath();ctx.arc(s.x*W,s.y*H,u*Math.max(W,H)*.8,0,7);ctx.stroke()}}
  ctx.globalAlpha=1;
  bolts=bolts.filter(b=>now-b.born<600);
  for(const b of bolts){const t=now-b.born;if(t<0)continue;
    if(!b.f){b.f=1;flashT=now}
    ctx.save();ctx.globalAlpha=t<350?(rnd()>.25?1:.5):1-(t-350)/250;
    ctx.strokeStyle='#eaf4ff';ctx.shadowColor='#7aa8ff';ctx.shadowBlur=25;ctx.lineWidth=4;ctx.lineJoin='round';
    ctx.beginPath();b.pts.forEach((q,i)=>i?ctx.lineTo(q[0]*W,q[1]*H):ctx.moveTo(q[0]*W,q[1]*H));ctx.stroke();ctx.restore()}
  shields=shields.filter(s=>now-s.born<2800);
  if(lastPalm)for(const s of shields){
    const t=now-s.born,a=Math.min(t/200,1)*(t>2300?1-(t-2300)/500:1),R=palmS*W*1.6*(.6+.4*Math.min(t/250,1));
    ctx.save();ctx.translate(lastPalm.x*W,lastPalm.y*H);ctx.globalAlpha=a;
    ctx.shadowColor='#4fd1ff';ctx.shadowBlur=30;ctx.strokeStyle='#bff3ff';ctx.lineWidth=5;
    ctx.fillStyle='rgba(79,209,255,.18)';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.stroke();
    ctx.rotate(t/500);ctx.beginPath();
    for(let k=0;k<6;k++){const an=k/6*6.283;ctx[k?'lineTo':'moveTo'](Math.cos(an)*R*.85,Math.sin(an)*R*.85)}
    ctx.closePath();ctx.stroke();ctx.restore()}
  ctx.globalAlpha=1;
  parts=parts.filter(q=>now-q.born<q.life);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;
    ctx.globalAlpha=Math.max(0,1-(now-q.born)/q.life);ctx.fillStyle=q.c;
    if(q.rect)ctx.fillRect(q.x,q.y,q.s,q.s*.6);else{ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,7);ctx.fill()}}
  ctx.globalAlpha=1;
  if(laser){ctx.save();ctx.lineCap='round';ctx.shadowColor='#ff2840';ctx.shadowBlur=25;
    ctx.beginPath();ctx.moveTo(laser.x,laser.y);ctx.lineTo(laser.x+laser.dx*3000,laser.y+laser.dy*3000);
    ctx.strokeStyle='rgba(255,40,60,.95)';ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(laser.x,laser.y,7,0,7);ctx.fill();ctx.restore()}
}

// ====== กล้อง + ตรวจจับมือ ======
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function onResults(res){
  const W=cv.width=v.videoWidth||640,H=cv.height=v.videoHeight||480;
  ctx.clearRect(0,0,W,H);
  const hands=res.multiHandLandmarks||[];
  if(hands.length){
    const l=hands[0];lastPalm={x:l[9].x,y:l[9].y};palmS=d(l[0],l[9]);
    ctx.strokeStyle='rgba(79,209,255,.8)';ctx.lineWidth=3;
    CONN.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(l[a].x*W,l[a].y*H);ctx.lineTo(l[b].x*W,l[b].y*H);ctx.stroke()});
    ctx.fillStyle='#ff5ea8';l.forEach(p=>{ctx.beginPath();ctx.arc(p.x*W,p.y*H,4,0,7);ctx.fill()});
    const g=classify(l);onGesture(g);
    if(g==='point'){const dx=(l[8].x-l[5].x)*W,dy=(l[8].y-l[5].y)*H,L=Math.hypot(dx,dy)||1;laser={x:l[8].x*W,y:l[8].y*H,dx:dx/L,dy:dy/L}}else laser=null;
    $('status').textContent='ตรวจพบ: '+ICON[g];$('cur').textContent=g==='other'?'':ICON[g].split(' ')[0];
  }else{laser=null;onGesture('other');$('status').textContent='ยังไม่เจอมือ — ยกมือให้อยู่ในกล้อง';$('cur').textContent=''}
  drawChakra(W,H,performance.now());drawFx(W,H,performance.now());
}
$('go').onclick=async()=>{
  $('go').disabled=true;$('go').textContent='กำลังเปิดกล้อง…';
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{
    if(typeof Hands==='undefined')throw new Error('โหลดไลบรารีตรวจจับมือไม่สำเร็จ (เครือข่าย/CDN ถูกบล็อก)');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
    v.srcObject=stream;await v.play();
    const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(onResults);
    $('start').style.display='none';$('status').textContent='กำลังโหลดโมเดล…';
    let busy=false;
    (async function loop(){
      if(!busy&&v.readyState>=2){busy=true;try{await hands.send({image:v})}catch(e){}busy=false}
      requestAnimationFrame(loop);
    })();
  }catch(e){
    $('go').disabled=false;$('go').textContent='ลองใหม่';
    $('start').querySelector('div:nth-child(2)').innerHTML='⚠️ '+(e.message||e)+'<br><small>ตรวจสอบสิทธิ์กล้อง หรือดาวน์โหลดไฟล์ไปเปิดในเครื่อง</small>';
  }
};
</script>
